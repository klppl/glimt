services:
  glimt:
    # Pull the image published by the GitHub Actions workflow.
    # Pin a version (ghcr.io/klppl/glimt:v12) or track :latest.
    image: ghcr.io/klppl/glimt:latest
    # To build locally instead, comment out `image:` and uncomment:
    # build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GLIMT_ADDR: ":8080"
      GLIMT_DB: "/data/glimt.db"
      # First admin is created on first boot from these:
      GLIMT_ADMIN_USER: "admin"
      GLIMT_ADMIN_PASS: "change-me-now"
      # Public base URL (enables Secure cookies + absolute share/snippet links):
      GLIMT_BASE_URL: "https://stats.example.com"

      # --- Behind Cloudflare ---
      # CF sets the real client IP in CF-Connecting-IP:
      GLIMT_REAL_IP_HEADER: "CF-Connecting-IP"
      # Only honor that header from trusted upstreams. "cloudflare" = CF edge
      # ranges; add "private" when a local proxy (npmplus in Docker) sits in
      # between, so glimt trusts the proxy that forwards CF's header.
      GLIMT_TRUSTED_PROXIES: "cloudflare,private"
      # Use CF's CF-IPCountry header for country reports — no GeoIP DB needed:
      GLIMT_CF_COUNTRY: "true"

      # Optional local GeoIP instead of/in addition to CF (mount via volume):
      # GLIMT_GEO_DB: "/data/geo.mmdb"
    volumes:
      - glimt-data:/data
      # Put your dbip-country-lite.mmdb or GeoLite2-City.mmdb at ./geo.mmdb:
      # - ./geo.mmdb:/data/geo.mmdb:ro

volumes:
  glimt-data:
